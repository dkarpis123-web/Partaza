# Builds a test Android app (APK) in Expo's cloud and puts its download link on the website (partaza.eu/app).
# Started by hand: GitHub → Actions → this workflow → "Run workflow".
# Needs one repository secret, EXPO_TOKEN (an access token from expo.dev → Account settings → Access tokens).
name: Android test build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Link the Expo project (first run creates it)
        run: eas init --non-interactive --force
      - name: Build and wait for the result
        run: eas build --platform android --profile preview --non-interactive --json > build.json
      - name: Put the download link on the website
        run: |
          git checkout -- .
          node -e "
            const b = JSON.parse(require('fs').readFileSync('build.json', 'utf8'))[0];
            const url = b && b.artifacts && (b.artifacts.applicationArchiveUrl || b.artifacts.buildUrl);
            if (!url) { console.error('No APK link in the build result'); process.exit(1); }
            require('fs').writeFileSync('public/android.json', JSON.stringify({ url, version: b.appVersion || null, built: new Date().toISOString() }, null, 2) + '\n');
          "
          rm build.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/android.json
          git commit -m "Nauja bandomoji Android programėlė svetainėje"
          git pull --rebase origin main
          git push origin HEAD:main
