# Builds a test Android app (APK) in Expo's cloud. Started by hand: GitHub → Actions → this workflow → "Run workflow".
# Needs one repository secret, EXPO_TOKEN (an access token from expo.dev → Account settings → Access tokens).
name: Android test build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Link the Expo project (first run creates it)
        run: eas init --non-interactive --force
      - name: Start the build
        run: eas build --platform android --profile preview --non-interactive --no-wait
