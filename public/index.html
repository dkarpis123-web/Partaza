<!doctype html>
<html lang="lt">
  <head>
    <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Partaza – transporto dalių rinka</title>
    <meta name="description" content="Naujos ir naudotos dalys automobiliams, motociklams, sunkvežimiams, laivams, mopedams ir dviračiams. Įdėkite skelbimą iš kelių nuotraukų, derėkitės dėl kainos." />
    <meta name="theme-color" content="#15181C" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Partaza" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Partaza" />
    <meta property="og:title" content="Partaza – transporto dalių rinka" />
    <meta property="og:description" content="Naujos ir naudotos dalys visam transportui. Skelbimas iš kelių nuotraukų, derybos dėl kainos." />
    <meta property="og:image" content="https://partaza.eu/logo512.png" />
    <meta property="og:url" content="https://partaza.eu/" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        /* Same colour as the opening animation, so there is no white flash while the app loads. */
        background-color: #15181c;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown instantly, before the app's code has loaded, so the screen is never blank.
         The app removes it and fades into the content once it is ready. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #15181c;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #boot .word {
        color: #fff;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -1px;
        line-height: 1.2;
        animation: boot-rise 0.42s cubic-bezier(0.33, 1, 0.68, 1) both;
      }
      #boot .track {
        position: relative;
        width: 150px;
        height: 4px;
        margin-top: 10px;
        border-radius: 2px;
        overflow: hidden;
      }
      #boot .line {
        position: absolute;
        inset: 0;
        border-radius: 2px;
        background-color: #c2410c;
        transform-origin: left center;
        animation: boot-draw 0.42s 0.3s cubic-bezier(0.33, 1, 0.68, 1) both, boot-pulse 1.4s 1s ease-in-out infinite;
      }
      #boot .tag {
        margin-top: 14px;
        color: #c9ced6;
        font-size: 15px;
        animation: boot-fade 0.42s 0.3s ease-out both;
      }
      #boot .tag2 {
        margin-top: 4px;
      }
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-draw {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes boot-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* While the code is still loading the line gently pulses, so it is clear something is happening. */
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .word, #boot .line, #boot .tag { animation: none; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript><p style="color: #fff; font-family: sans-serif; padding: 24px">Kad „Partaza“ veiktų, naršyklėje įjunkite „JavaScript“.</p></noscript>
    <div id="boot" aria-hidden="true">
      <div class="word">Partaza</div>
      <div class="track"><div class="line"></div></div>
      <div class="tag">Dalys visam transportui</div>
      <div class="tag tag2">Parts for every vehicle</div>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
